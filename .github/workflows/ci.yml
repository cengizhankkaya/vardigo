name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/api/.nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test against the built server
        env:
          PORT: "3000"
          DATABASE_PATH: ${{ runner.temp }}/vardigo.db
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          npm run smoke

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- lib/gen lib/core/l10n/gen lib/app/router/app_router.g.dart
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      # Goldens run in the macOS job below: text is rasterised differently on Linux.
      - run: flutter test --exclude-tags golden

  goldens:
    name: Mobile goldens
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --tags golden
      - name: Keep the diff images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: apps/mobile/test/goldens/failures/

  contract:
    name: Mobile against live API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/api/.nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Start the backend
        working-directory: apps/api
        env:
          DATABASE_PATH: ${{ runner.temp }}/vardigo.db
        run: |
          npm ci
          npm run build
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 1
          done
      - name: Run the case flow through the app repositories
        working-directory: apps/mobile
        env:
          LIVE_API_ORIGIN: http://127.0.0.1:3000
        run: |
          flutter pub get
          flutter test test/live
